name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: deno task test
      - name: Install imp
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://sobanieca.github.io/imp-ui/install.sh | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the page
        working-directory: ui
        run: |
          imp fmt --check
          imp lint
          imp test --unit
          imp build
      - name: Build the binary
        run: |
          deno compile -A --include ui/dist -o todoer main.js
          test "$(./todoer --version)" = "$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")"
